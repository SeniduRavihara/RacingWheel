; ============================================================
;  PlatformIO Configuration — ESP32-S3 Racing Wheel
; ============================================================

[env:esp32-s3-devkitc-1]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

; Board has 16MB flash + 8MB PSRAM (N16R8)
board_build.flash_size     = 16MB
board_build.psram_type     = opi
board_build.arduino.memory_type = qio_opi

; USB OTG — required for USB HID gamepad
build_flags =
    -D ARDUINO_USB_MODE=0
    -D ARDUINO_USB_CDC_ON_BOOT=0

; Upload via USB
upload_protocol = esptool
monitor_speed   = 115200

; Libraries
lib_deps =
    ; No external libs needed! MPU-6050 driven via raw I2C
    ; USB HID is built into ESP32 Arduino core
